name: mlir-toolchain

# Builds the pinned MLIR toolchain and publishes it as release assets under the
# tag named in tools/mlir-toolchain.lock.json. Publishing happens when that tag
# is pushed, which also opens a pull request to main with the checksums in the
# lock file, or on a manual run with `publish` set, after which you commit the
# printed lock file yourself. Pushing the tag is the only way to run this from a branch
# other than the default one.

on:
  push:
    tags: ["mlir-toolchain-*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the archives to the toolchain release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: mlir-toolchain (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae # 2026.10.09-1
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64@sha256:abd1230aa9e4058a74b89d27cd14ba18c0db036d7bfe6e6f219a29ea63c24eb6 # 2026.10.09-1
          - platform: macos-aarch64
            runner: macos-15
            container: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools (manylinux)
        if: startsWith(matrix.platform, 'linux')
        run: pipx install cmake ninja

      - name: Install build tools (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: brew install ninja

      - name: Build toolchain
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: tools/build-mlir-toolchain.sh --work-dir "$RUNNER_TEMP/mlir" --out-dir dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mlir-toolchain-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A tag push proposes the checksums to main, so start from its tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_type == 'tag' && 'main' || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Record checksums
        run: |
          python3 - <<'EOF' > "$RUNNER_TEMP/mlir-toolchain.lock.json"
          import hashlib, json, pathlib, sys
          lock = json.loads(pathlib.Path("tools/mlir-toolchain.lock.json").read_text())
          assets = {}
          for sha_file in sorted(pathlib.Path("dist").glob("*.sha256")):
              digest, name = sha_file.read_text().split()
              actual = hashlib.sha256((sha_file.parent / name).read_bytes()).hexdigest()
              if actual != digest:
                  sys.exit(f"{name}: {sha_file.name} says {digest}, archive is {actual}")
              assets[name] = digest
          if not assets:
              sys.exit("no toolchain archives were downloaded")
          lock["assets"] = assets
          print(json.dumps(lock, indent=2))
          EOF
          {
            echo '### tools/mlir-toolchain.lock.json'
            echo '```json'
            cat "$RUNNER_TEMP/mlir-toolchain.lock.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/mlir-toolchain-') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$(jq -r .release_tag tools/mlir-toolchain.lock.json)"
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" != "$tag" ]]; then
            echo "error: pushed tag $REF_NAME does not match release_tag $tag in the lock file" >&2
            exit 1
          fi
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --title "$tag" \
              --notes "Prebuilt MLIR toolchain used to build cudaq-pulse." --prerelease
          # Write-once: released sdists build against these exact archives, so
          # an existing asset is never replaced (gh refuses without --clobber).
          # A re-run skips the assets already there that match byte for byte.
          existing="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          upload=()
          for file in dist/*.tar.xz dist/*.sha256; do
            name="$(basename "$file")"
            if grep -qxF "$name" <<<"$existing"; then
              gh release download "$tag" --pattern "$name" --output "$RUNNER_TEMP/$name"
              if ! cmp -s "$file" "$RUNNER_TEMP/$name"; then
                echo "error: $name on release $tag differs from this run's archive" >&2
                exit 1
              fi
              echo "$name is already on $tag."
            else
              upload+=("$file")
            fi
          done
          if (( ${#upload[@]} )); then
            gh release upload "$tag" "${upload[@]}"
          fi
          echo "Published $tag with these checksums:"
          cat "$RUNNER_TEMP/mlir-toolchain.lock.json"

      # Main takes changes through pull requests only, so the checksums go to
      # a toolchain-checksums/<tag> branch and a pull request to main. Pushes
      # and pull requests made with GITHUB_TOKEN start no workflows: re-run
      # CI on the pull request before merging it.
      - name: Open a pull request with the checksums
        if: startsWith(github.ref, 'refs/tags/mlir-toolchain-')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp "$RUNNER_TEMP/mlir-toolchain.lock.json" tools/mlir-toolchain.lock.json
          if git diff --quiet -- tools/mlir-toolchain.lock.json; then
            echo "main already pins these checksums."
            exit 0
          fi
          branch="toolchain-checksums/$TAG"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          version="$(jq -r .llvm_version tools/mlir-toolchain.lock.json)"
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add tools/mlir-toolchain.lock.json
          git commit -s -m "Pin MLIR toolchain $version checksums" \
            -m "Records the checksums of the $TAG release assets in the lock file."
          # A re-run finds the branch already pushed; it is never overwritten.
          if git ls-remote --exit-code --heads "$remote" "$branch" >/dev/null; then
            git fetch --quiet "$remote" "refs/heads/$branch"
            if ! git diff --quiet HEAD FETCH_HEAD -- tools/mlir-toolchain.lock.json; then
              echo "error: branch $branch exists with other checksums; delete it or merge it first" >&2
              exit 1
            fi
            echo "Branch $branch already holds these checksums."
          else
            git push "$remote" "HEAD:refs/heads/$branch"
          fi
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main \
            --state open --json url --jq '.[0].url // empty')"
          if [[ -n "$pr" ]]; then
            echo "Pull request already open: $pr"
            exit 0
          fi
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Pin MLIR toolchain $version checksums" \
            --body "The mlir-toolchain workflow published the $TAG release assets; this records their checksums in tools/mlir-toolchain.lock.json. Pull requests opened by the workflow start no CI: re-run the checks, or push a commit to this branch, before merging."; then
            echo "error: could not open the pull request; open one from $branch to main by hand" >&2
            exit 1
          fi
