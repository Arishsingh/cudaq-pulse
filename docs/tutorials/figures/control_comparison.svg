<svg role="img" aria-labelledby="title desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="518.97pt" height="167.80pt" viewBox="0 0 518.97 167.80" xmlns="http://www.w3.org/2000/svg" version="1.1">
 <title id="title">Five control systems compared</title>
 <desc id="desc">Four bar charts side by side, one bar per control system: the length of the reset of Z4, the error of that reset, the length of one round of error correction, and the idle error of a data qubit over that round. one controller, 100 ns feedback: reset 380 ns with error 0.57%, round 1324 ns with idle error 1.23%; one controller, 400 ns feedback: reset 680 ns with error 1.64%, round 1624 ns with idle error 1.51%; a controller per feedline: reset 380 ns with error 0.57%, round 1324 ns with idle error 1.23%; drive and readout modules: reset 580 ns with error 1.28%, round 1524 ns with idle error 1.42%; six drive lanes: reset 380 ns with error 0.57%, round 1604 ns with idle error 1.50%.</desc>
 <defs>
  <style type="text/css">*{stroke-linejoin: round; stroke-linecap: butt}</style>
