 <title id="title">Ramsey fringes of a detuned drive</title>
 <desc id="desc">Excited-state population after the Ramsey sequence with a 1 MHz detuned drive, at the page's 41 waits from 0 to 4 microseconds. It oscillates between 0.05 and 0.95, with the first revival at 1000 ns, once per microsecond.</desc>
