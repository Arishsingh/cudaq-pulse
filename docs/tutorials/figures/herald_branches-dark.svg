<svg role="img" aria-labelledby="title desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="407.52pt" height="112.34pt" viewBox="0 0 407.52 112.34" xmlns="http://www.w3.org/2000/svg" version="1.1">
 <title id="title">What post-selection keeps</title>
 <desc id="desc">The branches of one heralded attempt measured on Z. The herald reads 0 with probability 97.2%; The herald reads 1 with probability 2.7%; The herald reads 2 with probability 7.5e-4. Post-selection keeps only the branches whose herald read 0, 97.2% of the shots: of those, Z reads 0 in 49.1% and 1 or 2 in 48.1%, as the T state gives. The rest are dropped.</desc>
