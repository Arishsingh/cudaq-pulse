<svg xmlns="http://www.w3.org/2000/svg" class="pv-svg pv-dark" role="img" aria-labelledby="title desc" viewBox="0 0 760 272">
 <title id="title">Two heralded attempts, then the T state</title>
 <desc id="desc">Two heralded attempts, then the T state. Attempt 1 reads D5 out. The outcome goes to herald on the controller link. herald accepts the shot: no π pulse. Attempt 2 reads D5 out. The outcome goes to herald on the controller link. herald accepts the shot: no π pulse. Y90 and the T gate's +π/4 frame shift prepare |T⟩. The last readout measures Z. Post-selection keeps the shot. If herald accepts both attempts, no π pulse plays (97.2% of shots). If herald rejects attempt 1 and accepts attempt 2, π 1 plays (2.7% of shots). If herald rejects both attempts, both π pulses play (8.2e-4 of shots). If herald accepts attempt 1 and rejects attempt 2, π 2 plays (3.2e-4 of shots).</desc>
