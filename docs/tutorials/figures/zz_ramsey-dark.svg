 <title id="title">Residual ZZ seen by a Ramsey sequence</title>
 <desc id="desc">D1's excited-state population against the Ramsey wait, from 0 to 20 microseconds, with its neighbour X2 in its ground state and excited. The two curves start together and separate as the wait grows, by 0.08 at 20 microseconds.</desc>
