 <title id="title">One pulse picks the axis</title>
 <desc id="desc">One pulse picks the axis. X axis: −Y90 turns +X onto Z. The readout gives ⟨X⟩ = 0.71. Y axis: X90 turns +Y onto Z. The readout gives ⟨Y⟩ = 0.71. Z axis: no pulse. The T gate shows as a +π/4 frame shift. The readout gives ⟨Z⟩ = 0.01.</desc>
