 <title id="title">A branch on another controller's readout</title>
 <desc id="desc">Timelines of the two toy controllers. Controller 0 acquires qudit 0 from cycle 0 to 200 into bit m0. The bit takes 80 cycles of feedback latency and 40 of peer latency, so controller 1 branches on it at cycle 320 and, only when it is 1, flips qudit 2 from 320 to 360. One cycle is 1 ns.</desc>
