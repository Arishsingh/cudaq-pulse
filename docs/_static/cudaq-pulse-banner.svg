<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 630" width="1800" height="630" role="img" aria-labelledby="t d">
<title id="t">CUDA-Q Pulse</title><desc id="d">A Python pulse kernel beside a timeline of drive, readout, and GPU lanes. A readout result goes to a GPU decoder over NVQLink within a latency budget, and the answer conditions the next drive pulse.</desc>
<style>.s{font-family:'NVIDIA Sans','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace}</style>
