<text x="80" y="112" class="s" font-size="60" fill="#eceeea" font-weight="700" text-anchor="start">CUDA-Q Pulse</text>
<rect x="80" y="132" width="96" height="6" rx="3" fill="#76b900"/>
<text x="196" y="143" class="s" font-size="24" fill="#9aa19a" font-weight="400" text-anchor="start">pulses, measurements and classical calls in one Python program</text>
<rect x="80" y="175" width="676" height="395" rx="16" fill="#17191a" stroke="#2c3030" stroke-width="2"/>
<circle cx="108" cy="200" r="7" fill="#ff5f57" opacity="0.8"/>
<circle cx="132" cy="200" r="7" fill="#febc2e" opacity="0.8"/>
<circle cx="156" cy="200" r="7" fill="#28c840" opacity="0.8"/>
<text x="108" y="252" class="m" font-size="19" xml:space="preserve"><tspan fill="#dcdcaa">@pulse.kernel</tspan></text>
<text x="108" y="283" class="m" font-size="19" xml:space="preserve"><tspan fill="#c586c0">def </tspan><tspan fill="#dcdcaa">adapt</tspan><tspan fill="#eceeea">(q):</tspan></text>
<text x="108" y="314" class="m" font-size="19" xml:space="preserve"><tspan fill="#eceeea">    d = </tspan><tspan fill="#76b900">get_drive_line</tspan><tspan fill="#eceeea">(q)</tspan></text>
<text x="108" y="345" class="m" font-size="19" xml:space="preserve"><tspan fill="#eceeea">    r = </tspan><tspan fill="#76b900">get_readout_line</tspan><tspan fill="#eceeea">(q)</tspan></text>
<text x="108" y="376" class="m" font-size="19" xml:space="preserve"><tspan fill="#eceeea">    m = </tspan><tspan fill="#76b900">readout</tspan><tspan fill="#eceeea">(r, square(300 * pulse.ns, 0.05))</tspan></text>
<text x="108" y="407" class="m" font-size="19" xml:space="preserve"><tspan fill="#eceeea">    request = </tspan><tspan fill="#f5b324">decode</tspan><tspan fill="#eceeea">.submit([m])</tspan></text>
<text x="108" y="438" class="m" font-size="19" xml:space="preserve"><tspan fill="#eceeea">    in_time, flip = request.result(timeout=4 * pulse.us)</tspan></text>
<text x="108" y="469" class="m" font-size="19" xml:space="preserve"><tspan fill="#eceeea">    correct = flip </tspan><tspan fill="#c586c0">if </tspan><tspan fill="#eceeea">in_time </tspan><tspan fill="#c586c0">else </tspan><tspan fill="#eceeea">m</tspan></text>
<text x="108" y="500" class="m" font-size="19" xml:space="preserve"><tspan fill="#c586c0">    if </tspan><tspan fill="#eceeea">correct:</tspan></text>
<text x="108" y="531" class="m" font-size="19" xml:space="preserve"><tspan fill="#eceeea">        </tspan><tspan fill="#76b900">drive</tspan><tspan fill="#eceeea">(d, d.get_calibration(pulse.gates.X))</tspan></text>
